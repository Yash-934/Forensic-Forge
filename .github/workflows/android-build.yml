name: Android APK Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install SDK 35
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Align & Sign Release APK (V1 + V2 + V3 Signature)
        run: |
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          RELEASE_DIR="app/build/outputs/apk/release"
          UNSIGNED_APK="${RELEASE_DIR}/app-release-unsigned.apk"
          ALIGNED_APK="${RELEASE_DIR}/app-release-aligned.apk"
          SIGNED_APK="${RELEASE_DIR}/DeepVault-Recovery-v2.0-Signed.apk"

          # Generate a dedicated non-debug release keystore so Play Protect does not flag public debug keys
          keytool -genkeypair -v \
            -keystore release-signing.jks \
            -storepass deepvault2026 \
            -alias deepvault_release \
            -keypass deepvault2026 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=DeepVault Studio, OU=Engineering, O=DeepVault Labs, L=Mumbai, ST=MH, C=IN"

          "${BUILD_TOOLS}/zipalign" -v -p 4 "${UNSIGNED_APK}" "${ALIGNED_APK}"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks release-signing.jks \
            --ks-key-alias deepvault_release \
            --ks-pass pass:deepvault2026 \
            --key-pass pass:deepvault2026 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "${SIGNED_APK}" \
            "${ALIGNED_APK}"

          "${BUILD_TOOLS}/apksigner" verify --verbose "${SIGNED_APK}"
          rm -f "${UNSIGNED_APK}" "${ALIGNED_APK}" release-signing.jks

      - name: Upload Signed Release APK (Recommended for Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: DeepVault-Recovery-Release-Signed-APK
          path: app/build/outputs/apk/release/DeepVault-Recovery-v2.0-Signed.apk
          if-no-files-found: error

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepVault-Recovery-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
